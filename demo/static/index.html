<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1630">
  <title>Restaurant Quimper</title>
  <link rel="stylesheet" href="/static/styles.css?v=7">
</head>
<body>
  <div id="payBanner" class="pay-banner" role="status" hidden></div>
  <header class="hero">
    <nav class="topbar">
      <span class="brand"><svg class="gwenn-ha-du" viewBox="0 0 54 36" aria-hidden="true"><rect width="54" height="36" fill="#fff"/><g fill="#111"><rect y="0" width="54" height="4"/><rect y="8" width="54" height="4"/><rect y="16" width="54" height="4"/><rect y="24" width="54" height="4"/><rect y="32" width="54" height="4"/></g><rect width="24" height="20" fill="#fff"/><g fill="#111"><path d="M5 3l1.5 5h-3zM12 3l1.5 5h-3zM19 3l1.5 5h-3zM8.5 11l1.5 5h-3zM15.5 11l1.5 5h-3z"/></g></svg>Restaurant Quimper</span>
      <div class="lang-switch" role="group" aria-label="Language">
        <button data-lang="fr" class="active">FR</button>
        <button data-lang="en">EN</button>
        <button data-lang="zh">中文</button>
      </div>
    </nav>
    <div class="hero-body">
      <p class="eyebrow" data-i18n="eyebrow"></p>
      <h1 data-i18n="title"></h1>
      <p class="lead" data-i18n="lead"></p>
      <button id="callBtn" class="call-btn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
        <span data-i18n="call"></span>
      </button>
      <p class="hint" data-i18n="hint"></p>
      <p id="configWarning" class="warning" hidden></p>
    </div>
  </header>

  <main class="layout">
    <section class="menu-section">
      <h2 data-i18n="menuTitle"></h2>
      <div id="menu"></div>
    </section>
    <aside class="info">
      <h3 data-i18n="infoTitle"></h3>
      <p id="address"></p>
      <p id="hours"></p>
      <p><a href="/kitchen" target="_blank" data-i18n="kitchenLink"></a></p>
    </aside>
  </main>

  <div id="callPanel" class="call-panel" hidden>
    <div class="sheet-handle" aria-hidden="true"><span></span></div>
    <div class="call-head">
      <div>
        <div class="call-title" data-i18n="callTitle"></div>
        <div id="callStatus" class="call-status"></div>
      </div>
      <div class="call-actions">
        <button id="minBtn" class="ghost icon" aria-label="Minimize"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <button id="muteBtn" class="ghost call-btn-icon"><svg class="ico-mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="slash" d="M4 4l16 16"/></svg><span class="btn-label" data-i18n="mute"></span></button>
        <button id="hangupBtn" class="hangup call-btn-icon"><svg class="ico-hang" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 14.5c4.7-4.2 12.3-4.2 17 0l-1.9 2.4a1 1 0 0 1-1.3.2l-2.6-1.6a1 1 0 0 1-.5-.9v-2.1a12 12 0 0 0-5.4 0v2.1a1 1 0 0 1-.5.9l-2.6 1.6a1 1 0 0 1-1.3-.2z"/></svg><span class="btn-label" data-i18n="hangup"></span></button>
      </div>
    </div>
    <div class="voice-check">
      <div id="statePill" class="state-pill" data-state="connecting"><span class="dot"></span><span id="stateText"></span></div>
      <div class="meters">
        <div class="meter-row"><span data-i18n="micLevel"></span><div class="meter"><div id="micMeter"></div></div></div>
        <div class="meter-row"><span data-i18n="heardLevel"></span><div class="meter"><div id="heardMeter"></div></div></div>
      </div>
      <select id="micSelect" aria-label="Microphone"></select>
    </div>
    <div id="voiceWarning" class="voice-warning" hidden></div>
    <div class="call-body">
      <div class="transcript-wrap">
        <div id="transcript" class="transcript" aria-live="polite"></div>
        <div id="interim" class="interim"></div>
      </div>
      <div class="cart">
        <h4 data-i18n="cartTitle"></h4>
        <ul id="cartLines"></ul>
        <div class="cart-total"><span data-i18n="total"></span><strong id="cartTotal">€0.00</strong></div>
        <div id="payBox" class="pay-box" hidden>
          <a id="payBtn" class="pay-btn" target="_blank" rel="noopener"></a>
          <div id="payState" class="pay-state"></div>
        </div>
        <div id="confirmation" class="confirmation" hidden></div>
      </div>
    </div>
  </div>

  <audio id="botAudio" autoplay playsinline></audio>
  <script src="/static/app.js?v=7"></script>
</body>
</html>
