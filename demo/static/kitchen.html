<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen Board</title>
  <link rel="stylesheet" href="/static/styles.css?v=6">
</head>
<body>
  <div class="board">
    <h1>Restaurant Quimper · 后厨看板 / Écran cuisine</h1>
    <p class="sub">AI 电话订单与订座实时显示（每 3 秒刷新，新单响铃）</p>
    <h2 class="section-title">订单 Commandes</h2>
    <div id="orders" class="board-grid"></div>
    <h2 class="section-title">订座 Réservations</h2>
    <div id="reservations" class="board-grid"></div>
  </div>
  <script>
    const STATUSES = [["new", "新单"], ["preparing", "制作中"], ["ready", "可取餐"], ["done", "已完成"]];
    let known = null;

    function beep() {
      try {
        const ctx = new AudioContext(), osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.frequency.value = 880; gain.gain.value = 0.15;
        osc.connect(gain).connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.4);
      } catch {}
    }

    const PAYMENT = { paid: ["已支付", "paid"], pending: ["待支付", "pending"], pay_at_pickup: ["到店付款", "pickup"] };
    const payBadge = (p) => { const [label, cls] = PAYMENT[p] || PAYMENT.pay_at_pickup; return `<span class="pay-badge ${cls}">${label}</span>`; };

    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    async function setStatus(id, status) {
      await fetch(`/api/orders/${id}/status`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status }) });
      refresh();
    }

    async function refresh() {
      const { orders, reservations } = await (await fetch("/api/orders")).json();
      const ids = new Set(orders.map((o) => o.id));
      if (known && [...ids].some((id) => !known.has(id))) beep();
      known = ids;

      document.getElementById("orders").innerHTML = orders.length ? orders.map((o) => `
        <article class="ticket ${o.status}">
          <header><span class="id">${esc(o.id)}</span><span class="meta">取餐 ${esc(o.pickup_time)} · ${esc(o.language)}</span></header>
          <div class="meta">${esc(o.customer_name)} · ${esc(o.phone)} ${payBadge(o.payment)}</div>
          <ul>${o.lines.map((l) => `<li>${l.quantity} × ${esc(l.name)}${l.note ? ` <em>(${esc(l.note)})</em>` : ""}</li>`).join("")}</ul>
          <strong>€${o.total.toFixed(2)}</strong>
          <div class="actions">${STATUSES.map(([s, label]) => `<button class="${o.status === s ? "on" : ""}" onclick="setStatus('${esc(o.id)}','${s}')">${label}</button>`).join("")}</div>
        </article>`).join("") : `<p class="sub">暂无订单</p>`;

      document.getElementById("reservations").innerHTML = reservations.length ? reservations.map((r) => `
        <article class="ticket">
          <header><span class="id">${esc(r.id)}</span><span class="meta">${esc(r.date)} ${esc(r.time)}</span></header>
          <div>${esc(r.party_size)} 位 · ${esc(r.customer_name)} · ${esc(r.phone)}</div>
        </article>`).join("") : `<p class="sub">暂无订座</p>`;
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
